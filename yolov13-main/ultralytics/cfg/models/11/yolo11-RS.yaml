# YOLO11 Small Object Detection Model with Enhanced Feature Preservation
# Optimized for small objects (~10 pixels) by enhancing early feature extraction

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  x: [1.00, 1.50, 512] # Using x-scale for better feature extraction

# YOLO11 backbone optimized for small object detection
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (keep first downsampling)
  - [-1, 2, C3k2, [128, False, 0.25]]  # Add more layers for early feature extraction
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4 (keep second downsampling)
  - [-1, 2, C3k2, [256, True, 0.25]]  # Add attention for better small object representation
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8 (keep third downsampling)
  - [-1, 3, C3k2, [512, True, 0.25]]  # Add more layers and attention
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16 (keep fourth downsampling)
  - [-1, 3, C3k2, [512, True]]  # Add more layers
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32 (keep fifth downsampling)
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11 (add attention for better feature representation)

# YOLO11 head optimized for small object detection
head:
  # Enhanced feature fusion for small objects
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  # Detect layer with standard strides for compatibility
  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3/8, P4/16, P5/32)
