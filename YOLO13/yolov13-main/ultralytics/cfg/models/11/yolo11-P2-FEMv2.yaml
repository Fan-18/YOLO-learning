# Ultralytics YOLO11 修订版: 移除P5头 + 增加FEM (P2, P3, P4层)
# 特性：P4直连全局模块 + 三层特征尺度对称 FEM 增强
nc: 10 
scales:
  n: [0.50, 0.25, 1024] 

backbone:
  # [from, repeats, module, args[Out Channels, Kernel Size, Stride, Padding]]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]            # 3-P2 增强

  - [-1, 1, Conv, [256, 3, 2]]     # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]            # 6-P3 增强

  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16
  - [-1, 2, C3k2, [512, True]]     # 8-P4 处理后
  - [-1, 1, FEM, [512]]            # 9-P4 增强 (新增位置)
  
  - [-1, 1, SPPF, [512, 5]]        # 10
  - [-1, 2, C2PSA, [512]]          # 11-全局上下文 (Backbone 最终输出)

head:
  # 自上而下路径 (Top-Down)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (P4->P3)
  - [[-1, 6], 1, Concat, [1]]      # 13 拼接 Backbone FEM-P3 (层索引未变)
  - [-1, 2, C3k2, [256, False]]    # 14 (P3-Middle)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (P3->P2)
  - [[-1, 3], 1, Concat, [1]]      # 16 拼接 Backbone FEM-P2 (层索引未变)
  - [-1, 2, C3k2, [128, False]]    # 17 (P2-Micro Output)

  # 自下而上路径 (Bottom-Up)
  - [-1, 1, Conv, [256, 3, 2]]     # 18 (P2->P3)
  - [[-1, 14], 1, Concat, [1]]     # 19 拼接 Head P3-Middle (原13变14)
  - [-1, 2, C3k2, [256, False]]    # 20 (P3-Output)

  - [-1, 1, Conv, [256, 3, 2]]     # 21 (P3->P4)
  - [[-1, 11], 1, Concat, [1]]     # 22 拼接 Backbone P4-C2PSA (原10变11)
  - [-1, 2, C3k2, [512, False]]    # 23 (P4-Output) 

  # 最终检测层
  # 输入分别为：P2-Output (17), P3-Output (20), P4-Output (23)
  - [[17, 20, 23], 1, Detect, [nc]] # 24