# Ultralytics YOLO11 修订版: 移除P5头 + 增加FEM (P2, P3层)
# YOLO11 修订版:P4直连全局模块
nc: 10 
scales:
 # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  # s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  # m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs



backbone:
  # [from, repeats, module, args[Out Channels, Kernel Size, Stride, Padding]]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]            # 3-P2 增强 [cite: 54, 156]

  - [-1, 1, Conv, [256, 3, 2]]     # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]            # 6-P3 增强 [cite: 54, 156]

  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16
  - [-1, 2, C3k2, [512, True]]     # 8-P4处理后
  - [-1, 1, SPPF, [512, 5]]        # 9 (此时通道保持在512)
  - [-1, 2, C2PSA, [512]]          # 10-全局上下文模块 (P4级别) 

head:
# 自上而下路径 (Top-Down)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4->P3)
  - [[-1, 6], 1, Concat2, [1]]             # 12: 修正语法，连 Backbone FEM-P3 (Index 6)
  - [-1, 2, C3k2, [256, False]]                # 13 (P3-Middle)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3->P2)
  - [[-1, 3], 1, Concat2, [1]]             # 15: 修正语法，连 Backbone FEM-P2 (Index 3)
  - [-1, 2, C3k2, [128, False]]                # 16 (P2-Output)

  # 自下而上路径 (Bottom-Up)
  - [-1, 1, Conv, [256, 3, 2]]                 # 17 (P2->P3)
  - [[-1, 6, 13], 1, Concat3, [1]]         # 18: 修正语法，实现论文 FFM 三路融合 (Index -1, 6, 13) [cite: 258]
  - [-1, 2, C3k2, [256, False]]                # 19 (P3-Output)

  - [-1, 1, Conv, [256, 3, 2]]                 # 20 (P3->P4)
  - [[-1, 10], 1, Concat2, [1]]            # 21: 修正语法，连 Backbone P4 全局模块 (Index 10)
  - [-1, 2, C3k2, [512, False]]                # 22 (P4-Output) 


# 针对 P2 输出 (Layer 16) 进行增强
  - [16, 1, SCAM1, [ ]]  # 23: 输入是第 16 层 (P2, 128ch)

  # 针对 P3 输出 (Layer 19) 进行增强
  - [19, 1, SCAM1, [ ]]  # 24: 输入是第 19 层 (P3, 256ch) -> 你原来写成了 29

  # 针对 P4 输出 (Layer 22) 进行增强
  - [22, 1, SCAM1, [ ]]  # 25: 输入是第 22 层 (P4, 512ch)

  # 最终检测层
  # 注意：Detect 的来源变成了 SCAM 处理后的这三层 [23, 24, 25]
  - [[23, 24, 25], 1, Detect, [nc]]            # 26: 检测头