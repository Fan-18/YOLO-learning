# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  # s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  # m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]          # 3-P2 增强 (Out: 256)

  - [-1, 1, Conv, [256, 3, 2]]   # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]          # 6-P3 增强 (Out: 512) <--- 修正: 保持512通道

  - [-1, 1, Conv, [512, 3, 2]]   # 7-P4/16
  - [-1, 2, C3k2, [512, True]]   # 8
  - [-1, 1, FEM, [512]]          # 9-P4 增强 (Out: 512) <--- 修正: 保持512通道

  - [-1, 1, Conv, [1024, 3, 2]]  # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 11
  - [-1, 1, SPPF, [1024, 5]]     # 12
  - [-1, 2, C2PSA, [1024]]       # 13-P5 Backbone Output

head:
  # --- Top-Down (自上而下) ---
  
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 9], 1, Concat, [1]]    # 15 (cat backbone P4 FEM)
  - [-1, 2, C3k2, [512, False]]  # 16-P4 TD Output

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 6], 1, Concat, [1]]    # 18 (cat backbone P3 FEM)
  - [-1, 2, C3k2, [256, False]]  # 19-P3 TD Output

  # P3 -> P2 (新增小目标路径)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 20
  - [[-1, 3], 1, Concat, [1]]    # 21 (cat backbone P2 FEM)
  - [-1, 2, C3k2, [128, False]]  # 22-P2 Output (检测头1: 小微目标)

  # --- Bottom-Up (自下而上) ---

  # P2 -> P3
  - [-1, 1, Conv, [256, 3, 2]]   # 23
  - [[-1, 19], 1, Concat, [1]]   # 24 (cat head P3 TD layer 19) <--- 修正: 连接C3k2的输出
  - [-1, 2, C3k2, [256, False]]  # 25-P3 Output (检测头2: 小目标)

  # P3 -> P4
  - [-1, 1, Conv, [512, 3, 2]]   # 26 (注意通道数升回512)
  - [[-1, 16], 1, Concat, [1]]   # 27 (cat head P4 TD layer 16) <--- 修正: 连接C3k2的输出
  - [-1, 2, C3k2, [512, False]]  # 28-P4 Output (检测头3: 中目标)

  # P4 -> P5
  - [-1, 1, Conv, [1024, 3, 2]]  # 29
  - [[-1, 13], 1, Concat, [1]]   # 30 (cat backbone P5 layer 13) <--- 修正: 连接C2PSA
  - [-1, 2, C3k2, [1024, True]]  # 31-P5 Output (检测头4: 大目标)

  # Detect (P2, P3, P4, P5)
  - [[22, 25, 28, 31], 1, Detect, [nc]] # 32