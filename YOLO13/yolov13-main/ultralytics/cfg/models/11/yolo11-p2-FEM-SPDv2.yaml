# Ultralytics YOLO11 修订版: SPD-Conv + FEM + C2PSA
# 目标：极致提升遥感小目标 (VisDrone) 检测精度
nc: 10 
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2: 初始下采样保留基本空间信息
  
  # --- 关键修改：使用 SPDConv 替代常规下采样 ---
  - [-1, 1, SPDConv, [128, 3, 1]]  # 1-P2/4: 无损下采样，完整保留 P2 层微小目标像素
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]            # 3-P2 增强：此时输入的是 SPD 保留的无损特征

  # --- 再次使用 SPDConv 进入 P3 ---
  - [-1, 1, SPDConv, [256, 3, 1]]  # 4-P3/8: 无损下采样进入中尺寸特征层
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]            # 6-P3 增强

  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16: 深层可以使用普通卷积平衡计算量
  - [-1, 2, C3k2, [512, True]]     # 8
  - [-1, 1, SPPF, [512, 5]]        # 9
  - [-1, 2, C2PSA, [512]]          # 10-全局上下文模块 (P4级别) 

head:
  # 自上而下路径 (Top-Down)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4->P3)
  - [[-1, 6], 1, Concat, [1]]      # 12 cat backbone FEM-P3
  - [-1, 2, C3k2, [256, False]]    # 13 (P3-Middle)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3->P2)
  - [[-1, 3], 1, Concat, [1]]      # 15 cat backbone FEM-P2
  - [-1, 2, C3k2, [128, False]]    # 16 (P2-Micro Output)

  # 自下而上路径 (Bottom-Up)
  - [-1, 1, SPDConv, [256, 3, 1]]  # 17 (P2->P3): 使用 SPD 再次加强小目标特征回传
  - [[-1, 13], 1, Concat, [1]]     # 18 cat head P3
  - [-1, 2, C3k2, [256, False]]    # 19 (P3-Output)

  - [-1, 1, Conv, [256, 3, 2]]     # 20 (P3->P4)
  - [[-1, 10], 1, Concat, [1]]     # 21 cat head P4
  - [-1, 2, C3k2, [512, False]]    # 22 (P4-Output) 

  - [[16, 19, 22], 1, Detect, [nc]] # 23