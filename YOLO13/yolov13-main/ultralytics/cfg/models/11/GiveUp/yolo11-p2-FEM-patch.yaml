# Ultralytics YOLO11 修订版 + SOFE (并行增强模式)
# 特征：P2与P4长距离注意力增强，并在最终P2输出处融合

nc: 10 
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # ... (保持不变) ...
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]            # 3-P2 增强 (Low-Level Input)

  - [-1, 1, Conv, [256, 3, 2]]     # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]            # 6-P3 增强

  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16
  - [-1, 2, C3k2, [512, True]]     # 8-P4处理后
  - [-1, 1, SPPF, [512, 5]]        # 9
  - [-1, 2, C2PSA, [512]]          # 10-P4 全局上下文 (High-Level Input)

head:
  # === 1. 常规 FPN 流程 (Top-Down) ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P4->P3)
  - [[-1, 6], 1, Concat, [1]]      # 12 cat backbone FEM-P3
  - [-1, 2, C3k2, [256, False]]    # 13 (P3-Middle)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P3->P2)
  - [[-1, 3], 1, Concat, [1]]      # 15 cat backbone FEM-P2
  - [-1, 2, C3k2, [128, False]]    # 16 (P2-Micro 原始路径输出)

  # === 2. SOFE 模块 (并行分支) ===
  # 逻辑：利用 Backbone 顶层(Layer 10, P4) 增强 Backbone 底层(Layer 3, P2)
  # 注意：PatchSize=8 适配 4倍下采样差距 (P4 vs P2)
  - [[2, 10], 1, PatchAttention, [8, 256]] # 17: SOFE - MHCA
  - [-1, 1, Conv, [128, 7, 1]]             # 18: SOFE - 7x7 Conv (通道数对齐 Layer 16)

  # === 3. 融合 SOFE 到 P2 分支 ===
  # 将 FPN 的 P2 输出 (Layer 16) 与 SOFE 的输出 (Layer 18) 进行融合
  # 方式：可以是 Add (sum) 或者 Concat。这里用 Concat + Conv 融合更稳健
  - [[16, 18], 1, Concat, [1]]     # 19: 融合两条路径
  # - [-1, 1, C3k2, [128, False]]    # 20: P2 最终增强输出 (Detect 输入 1)

# 使用 3x3 卷积进行轻量化融合
  - [-1, 1, Conv, [128, 3, 1]]    # 20: P2 最终增强输出 (Detect 输入 1)

# === 4. 常规 PAN 流程 (Bottom-Up) ===
  
  # 必须先下采样 (160->80)，才能和 P3 (Layer 13) 拼接
  - [-1, 1, Conv, [256, 3, 2]]     # 21 (P2 -> P3 下采样) 
  # - [16, 1, Conv, [256, 3, 2]]     # 21 (P2 -> P3 下采样) 
  - [[-1, 13], 1, Concat, [1]]     # 22 cat FPN P3 (Layer 13)
  - [-1, 2, C3k2, [256, False]]    # 23 (P3-Output) -> Detect 输入 2

  - [-1, 1, Conv, [512, 3, 2]]     # 24 (P3 -> P4 下采样)
  - [[-1, 10], 1, Concat, [1]]     # 25 cat Backbone P4 (Layer 10)
  - [-1, 2, C3k2, [512, False]]    # 26 (P4-Output) -> Detect 输入 3

  # 最终检测 (注意索引变化)
  - [[20, 23, 26], 1, Detect, [nc]] # 27
