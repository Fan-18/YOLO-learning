# Ultralytics YOLO11 复现版: 基于 YoloBody 源码逻辑
# 模块: CSFA (自带上采样) + 手动融合流
nc: 10 
scales:
  n: [0.50, 0.25, 1024] 

backbone:
  # [from, repeats, module, args]
  # 对应源码中的 feat0, feat1, feat2, feat3
  # 注意：源码 feat0 是最浅层 (P1/2)，feat3 是最深层
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2  (对应 feat0)
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4  (对应 feat1)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, FEM, [256]]            # 3-P2 增强 (对应 feat1 的增强版)

  - [-1, 1, Conv, [256, 3, 2]]     # 4-P3/8  (对应 feat2)
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, FEM, [512]]            # 6-P3 增强 (对应 feat2 的增强版)

  - [-1, 1, Conv, [512, 3, 2]]     # 7-P4/16 (对应 feat3)
  - [-1, 2, C3k2, [512, True]]     # 8
  - [-1, 1, SPPF, [512, 5]]        # 9
  - [-1, 2, C2PSA, [512]]          # 10 (feat3 最终输出)

head:
  # ================= 1. CSFA1 (c5_1) =================
  # 源码: self.CSFA1(feat3, feat2) -> 融合 P4(Layer 10) 和 P3(Layer 6)
  # 参数: [ch_out, n, hw(Deep), patch_size] -> P4尺寸 40x40
  - [[10, 6], 1, CSFA, [256, 1, [40, 40], [4, 4]]] # 11
  - [-1, 1, Conv, [512, 3, 1]]      # 12 (对应 conv_for_csfa1 -> c5_1)

  # ================= 2. CSFA2 (c4_1) =================
  # 源码: self.CSFA2(feat2, feat1) -> 融合 P3(Layer 6) 和 P2(Layer 3)
  # 参数: P3尺寸 80x80
  - [[6, 3], 1, CSFA, [128, 2, [80, 80], [4, 4]]]  # 13
  - [-1, 1, Conv, [256, 3, 1]]      # 14 (对应 conv_for_csfa2 -> c4_1)

  # ================= 3. Manual Branch (c3_1) =================
  # 源码: f1_up = self.up(feat1) ... cat([feat0, f1_up])
  # 这里没用 CSFA，所以必须手动 Upsample
  - [3, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (Upsample P2)
  
  # cat([feat0, f1_up]) -> 融合 Layer 0 和 Layer 15
  - [[0, 15], 1, Concat, [1]]       # 16
  - [-1, 1, Conv, [128, 3, 1]]      # 17 (对应 conv_for_cat1 -> c3_1)

  # ================= 4. CSFA3 (c5_2) =================
  # 源码: self.CSFA3(c5_1, c4_1) -> 融合 c5_1(Layer 12) 和 c4_1(Layer 14)
  # 注意: c5_1 是 Deep，c4_1 是 Shallow。输入尺寸按 c5_1 (40x40)
  - [[12, 14], 1, CSFA, [256, 2, [80, 80], [4, 4]]] # 18
  - [-1, 1, Conv, [512, 3, 1]]      # 19 (对应 conv_for_csfa3 -> c5_2)

  # ================= 5. Aggregation (c4_2 & c5_3) =================
  
  # --- c4_2 = cat(c3_1, up(c4_1)) ---
  # c4_1 是 Layer 14，需要上采样
  - [14, 1, nn.Upsample, [None, 2, "nearest"]] # 20
  # cat c3_1(Layer 17) 和 up(c4_1)
  - [[17, 20], 1, Concat, [1]]      # 21
  - [-1, 1, Conv, [256, 3, 1]]      # 22 (对应 conv_for_cat2 -> c4_2)

  # --- c5_3 = cat(c4_2, up(c5_2)) ---
  # c5_2 是 Layer 19，需要上采样
  - [19, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  # cat c4_2(Layer 22) 和 up(c5_2)
  - [[22, 23], 1, Concat, [1]]      # 24
  - [-1, 1, Conv, [512, 3, 1]]      # 25 (对应 conv_for_cat3 -> c5_3)

  # ================= 6. Final Concatenation (Pout) =================
  # 源码: Pout = cat([c2, c3_1, c4_2, c5_3])
  # 你暂时去掉了 c2 (PatchAttention)，所以我们只 cat 剩下的
  # c3_1(Layer 17), c4_2(Layer 22), c5_3(Layer 25)
  - [[17, 22, 25], 1, Concat, [1]]  # 26
  
  # 源码: self.conv_all(Pout) -> 1x1 卷积融合
  - [-1, 1, Conv, [896, 1, 1]]      # 27 (128+256+512=896)

  # ================= 7. Detect =================
  # 对 Pout (Stride 4) 进行单尺度检测
  - [[27], 1, Detect, [nc]]         # 28