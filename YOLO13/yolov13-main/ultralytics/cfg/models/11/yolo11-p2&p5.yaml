# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  # s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  # l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  # x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs


backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4 (Stride 4)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2处理后
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3处理后
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]   # 6-P4处理后
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 8-P5处理后
  - [-1, 1, SPPF, [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]       # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (P5->P4)
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (P4-Middle)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14 (P4->P3)
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3-Small)

  # --- 新增 P2 路径开始 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (P3->P2, Stride 4)
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2 (索引2是C3k2后的P2)
  - [-1, 2, C3k2, [128, False]] # 19 (P2-Micro)
  # --- 新增 P2 路径结束 ---

  - [-1, 1, Conv, [256, 3, 2]] # 20 (P2->P3)
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3-output)

  - [-1, 1, Conv, [256, 3, 2]] # 23 (P3->P4)
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4-output)

  - [-1, 1, Conv, [512, 3, 2]] # 26 (P4->P5)
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5-output)

  # 最终 Detect 层包含 4 个尺寸：P2(19), P3(22), P4(25), P5(28)
  - [[19, 22, 25, 28], 1, Detect, [nc]]