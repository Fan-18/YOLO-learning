# 单独加一个P2检测头，这个检测头的部分没有设计FullPAD_Tunnel模块

nc: 80 
scales: 
  n: [0.50, 0.25, 1024] 

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]] # 1-P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]] # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]] # 3-P3/8
  - [-1, 2, DSC3k2,  [512, False, 0.25]] # 4
  - [-1, 1, DSConv,  [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6
  - [-1, 1, DSConv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

head:
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]] # 9
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [ 9, 1, DownsampleConv, []] # 11
  - [[6, 9], 1, FullPAD_Tunnel, []]  # 12 (P4 隧道)
  - [[4, 10], 1, FullPAD_Tunnel, []] # 13 (P3 隧道)
  - [[8, 11], 1, FullPAD_Tunnel, []] # 14 (P5 隧道)
  
  # --- 自上而下路径 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 12], 1, Concat, [1]] 
  - [-1, 2, DSC3k2, [512, True]] # 17 (P4 特征)
  - [[-1, 9], 1, FullPAD_Tunnel, []]  # 18 (P4 回归隧道)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 13], 1, Concat, [1]] 
  - [-1, 2, DSC3k2, [256, True]] # 21 (P3 特征)
  
  - [10, 1, Conv, [256, 1, 1]] # 22
  - [[21, 22], 1, FullPAD_Tunnel, []] # 23 (P3 回归隧道)

  # --- 新增 P2 路径 (针对小目标) ---
  - [21, 1, nn.Upsample, [None, 2, "nearest"]] # 24 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]] # 25 结合 Backbone P2
  - [-1, 2, DSC3k2, [128, True]] # 26 (P2 检测头特征层)

  # --- 自下而上回归路径 (补全 FullPAD_Tunnel) ---
  - [-1, 1, Conv, [128, 3, 2]] # 27 (P2 -> P3)
  - [[-1, 23], 1, Concat, [1]] 
  - [-1, 2, DSC3k2, [512, True]] # 29
  - [[-1, 10], 1, FullPAD_Tunnel, []] # 30 (新增 P3 维度增强隧道)

  - [-1, 1, Conv, [256, 3, 2]] # 31 (P3 -> P4)
  - [[-1, 18], 1, Concat, [1]] 
  - [-1, 2, DSC3k2, [512, True]] # 33
  - [[-1, 9], 1, FullPAD_Tunnel, []] # 34 (P4 维度增强隧道)

  - [-1, 1, Conv, [512, 3, 2]] # 35 (P4 -> P5)
  - [[-1, 14], 1, Concat, [1]] 
  - [-1, 2, DSC3k2, [1024, True]] # 37
  - [[-1, 11], 1, FullPAD_Tunnel, []] # 38 (P5 维度增强隧道)

  # Detect 层增加 P2 输入
  - [[26, 30, 34, 38], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)