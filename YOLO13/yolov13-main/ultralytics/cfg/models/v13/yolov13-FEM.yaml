nc: 80 
scales: 
  n: [0.50, 0.25, 1024] 

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2

  - [-1, 1, Conv,  [128, 3, 2, 1, 2]] # 1-P2/4
  - [-1, 2, DSC3k2,  [256, False, 0.25]] # 2
  # - [-1, 1, FEM, [256]] # 3 (新增：P2 层 FEM, 接层2)
  - [-1, 1, FEM_v2, [256]] # 3 (新增：P2 层 FEM, 接层2)


  - [-1, 1, Conv,  [256, 3, 2, 1, 4]] # 4-P3/8 (输入接层3)
  - [-1, 2, DSC3k2,  [512, False, 0.25]] # 5
  # - [-1, 1, FEM, [512]] # 6 (新增：P3 层 FEM, 接层5)
  - [-1, 1, FEM_v2, [512]] # 6 (新增：P3 层 FEM, 接层5)
  
  - [-1, 1, DSConv,  [512, 3, 2]] # 7-P4/16 (输入接层6)
  - [-1, 4, A2C2f, [512, True, 4]] # 8
  # - [-1, 1, FEM, [512]] # 9 (新增：P4 层 FEM, 接层8)
  - [-1, 1, FEM_v2, [512]] # 3 (新增：P2 层 FEM, 接层2)
  
  - [-1, 1, DSConv,  [1024, 3, 2]] # 10-P5/32 (输入接层9)
  - [-1, 4, A2C2f, [1024, True, 1]] # 11 (P5层保持原样，后面不加FEM)

head:
  # HyperACE 接收 P3, P4, P5
  # P3 来源 -> 层 6 (FEM输出)
  # P4 来源 -> 层 9 (FEM输出)
  # P5 来源 -> 层 11 (原A2C2f输出)
  - [[6, 9, 11], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]] # 12
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [ 12, 1, DownsampleConv, []] # 14
  
  # --- 隧道模块引用更新 ---
  # P4 Tunnel: 引用层 9 (P4 FEM)
  # P3 Tunnel: 引用层 6 (P3 FEM)
  # P5 Tunnel: 引用层 11 (P5 原生)
  
  - [[9, 12], 1, FullPAD_Tunnel, []]  # 15 (P4 Tunnel)
  - [[6, 13], 1, FullPAD_Tunnel, []]  # 16 (P3 Tunnel)
  - [[11, 14], 1, FullPAD_Tunnel, []] # 17 (P5 Tunnel)
  
  # --- Top-Down ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 15], 1, Concat, [1]] # 19 (Cat P4 Tunnel)
  - [-1, 2, DSC3k2, [512, True]] # 20
  - [[-1, 12], 1, FullPAD_Tunnel, []]  # 21 (P4 Head Tunnel)

  - [20, 1, nn.Upsample, [None, 2, "nearest"]] # 22
  - [[-1, 16], 1, Concat, [1]] # 23 (Cat P3 Tunnel)
  - [-1, 2, DSC3k2, [256, True]] # 24
  - [13, 1, Conv, [256, 1, 1]] # 25
  - [[24, 25], 1, FullPAD_Tunnel, []]  # 26 (P3 Head Tunnel)
  
  # --- Bottom-Up ---
  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 21], 1, Concat, [1]] # 28
  - [-1, 2, DSC3k2, [512, True]] # 29
  - [[-1, 12], 1, FullPAD_Tunnel, []]  # 30 (P4 Head Tunnel)

  - [29, 1, Conv, [512, 3, 2]] # 31
  - [[-1, 17], 1, Concat, [1]] # 32
  - [-1, 2, DSC3k2, [1024, True]] # 33
  - [[-1, 14], 1, FullPAD_Tunnel, []]  # 34 (P5 Head Tunnel)
  
  # --- Detect ---
  - [[26, 30, 34], 1, Detect, [nc]] # Detect(P3, P4, P5)